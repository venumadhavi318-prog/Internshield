<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Checks — InternShield</title><link rel="stylesheet" href="style.css">
<style>
  /* Standalone student dashboard styles so this page stays self-contained. */
  :root{--ink:#0d1424;--line:#e6e9f2}
  body{margin:0;font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#f7f8fc;color:var(--ink)}
  .nav{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--line);position:sticky;top:0}
  .brand{font-weight:800;text-decoration:none;color:var(--ink)}
  .brand span{color:#5b5cf0}
  .navLinks{display:flex;gap:10px;align-items:center}
  .navLinks a{text-decoration:none;color:#2b3245;font-weight:600;padding:8px 10px;border-radius:9px}
  .navLinks a:hover{background:#eef0ff;color:#5b5cf0}
  .ghost{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
  .adminWrap{max-width:820px;margin:0 auto;padding:40px 22px 70px}
  .eyebrow{text-transform:uppercase;letter-spacing:.24em;font-size:12px;font-weight:700;color:#5b5cf0;margin:0 0 6px}
  h1{margin:0 0 22px;font-size:26px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
  .signal{padding:14px 4px;border-bottom:1px solid var(--line)}
  .signal:last-child{border-bottom:0}
  .signal b{display:block;margin-bottom:3px}
  .signal span{color:#5c6579;font-size:14px}
  .risk{font-weight:800;border-radius:999px;padding:3px 9px}
  .risk.high{background:#ffe7eb;color:#d83a4e}.risk.medium{background:#fff2d6;color:#b77900}.risk.low{background:#ddf7ee;color:#0f9d72}
</style>
</head>
<body>
<header class="nav">
  <a class="brand" href="/">🛡️ Intern<span>Shield</span></a>
  <nav class="navLinks"><a href="/#checker">New check</a><button id="signout" class="ghost">Sign out</button></nav>
</header>
<main class="adminWrap">
  <p class="eyebrow">STUDENT DASHBOARD</p>
  <h1>My internship checks</h1>
  <div id="status" class="panel">Loading…</div>
</main>
<script type="module">
import {watchAuth,getMyAnalyses,logoutStudent} from "./js/firebase.js";
document.getElementById("signout").onclick=()=>logoutStudent().then(()=>location.href="/");
watchAuth(async u=>{
  if(!u){location.href="/";return}
  const box=document.getElementById("status");
  try{
    const rows=await getMyAnalyses(u);
    box.innerHTML=rows.length?rows.map(x=>`<div class="signal"><b>${esc(x.company||"Unknown company")} — <span class="risk ${String(x.level).toLowerCase()}">${esc(x.level)} (${esc(String(x.score))}/100)</span></b><span>${esc(x.title||"Internship")} · ${x.createdAt?.toDate?x.createdAt.toDate().toLocaleString():"Saved"}</span></div>`).join(""):"No saved checks yet. Run a check on the homepage to build your history.";
  }catch(err){
    box.innerHTML="We couldn't load your saved checks right now. If this is the first run, make sure Firestore is enabled and firestore.rules is published.";
  }
});
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
</script></body></html>
